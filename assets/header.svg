<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBFAF6"/>
      <stop offset="100%" stop-color="#F3F0E8"/>
    </linearGradient>
  </defs>

  <style>
    .eyebrow   { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 3.5px; fill: #C8452B; }
    .name      { font-family: Georgia, 'Times New Roman', Times, serif; font-size: 54px; font-weight: 700; fill: #171614; }
    .tagline   { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14.5px; font-weight: 400; fill: #6E685F; }
    .meta      { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 2.4px; fill: #9A9386; }
    .watermark { font-family: Georgia, 'Times New Roman', Times, serif; font-size: 190px; font-weight: 700; fill: #C8452B; opacity: 0.08; }
  </style>

  <!-- Paper -->
  <rect width="900" height="240" fill="url(#paper)"/>
  <rect x="0.75" y="0.75" width="898.5" height="238.5" fill="none" stroke="#DAD4C8" stroke-width="1.5"/>

  <!-- Editorial spine -->
  <rect x="0" y="0" width="6" height="240" fill="#C8452B"/>

  <!-- Oversized serif watermark -->
  <text x="858" y="198" text-anchor="end" class="watermark">AB</text>

  <g transform="translate(64, 0)">
    <text x="0" y="62" class="eyebrow">CYBERSECURITY ENGINEER &amp; RESEARCHER</text>
    <text x="-2" y="124" class="name">Akhil Binu<tspan fill="#C8452B">.</tspan></text>
    <rect x="0" y="144" width="110" height="3" fill="#C8452B"/>
    <text x="0" y="178" class="tagline">Application security · Threat detection · OSINT · Security tooling</text>
    <text x="0" y="212" class="meta">INDIA&#160;&#160;&#160;·&#160;&#160;&#160;OPEN TO COLLABORATIONS&#160;&#160;&#160;·&#160;&#160;&#160;AKHILBINU.IN</text>
  </g>
</svg>
