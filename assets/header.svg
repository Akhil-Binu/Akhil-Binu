<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', sans-serif; font-size: 38px; font-weight: 800; fill: #f8fafc; letter-spacing: 2px; }
    .role { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', sans-serif; font-size: 15px; font-weight: 600; fill: #38bdf8; letter-spacing: 3px; text-transform: uppercase; }
    .tagline { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', sans-serif; font-size: 13px; font-weight: 400; fill: #94a3b8; }
    .pill-bg { fill: #1e293b; stroke: #334155; stroke-width: 1; rx: 12px; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', sans-serif; font-size: 11px; font-weight: 600; fill: #cbd5e1; }
  </style>

  <!-- Card Frame -->
  <rect width="900" height="240" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>
  <rect width="900" height="240" rx="16" fill="url(#grid)"/>

  <!-- Radial Glow Behind Shield -->
  <circle cx="120" cy="120" r="70" fill="#38bdf8" opacity="0.12" filter="url(#glow)"/>

  <!-- Shield & Terminal Icon -->
  <g transform="translate(75, 75)">
    <!-- Shield Outer -->
    <path d="M45 5 L80 20 V50 C80 75 45 92 45 92 C45 92 10 75 10 50 V20 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
    <!-- Inner Accent Shield -->
    <path d="M45 13 L72 25 V48 C72 68 45 82 45 82 C45 82 18 68 18 48 V25 Z" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="3 2" opacity="0.6"/>
    <!-- Terminal Prompt / Key Symbol inside shield -->
    <path d="M32 38 L43 49 L32 60" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="48" y1="60" x2="60" y2="60" stroke="#818cf8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Text Hierarchy -->
  <g transform="translate(190, 68)">
    <!-- Status / Role -->
    <text x="0" y="20" class="role">CYBERSECURITY ENGINEER &amp; RESEARCHER</text>
    
    <!-- Full Name -->
    <text x="0" y="66" class="name">AKHIL BINU</text>

    <!-- Tagline -->
    <text x="0" y="98" class="tagline">Application Security • Threat Detection • OSINT • Defensive &amp; Offensive Tooling</text>

    <!-- Skill / Focus Pills -->
    <g transform="translate(0, 118)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="85" height="24" class="pill-bg"/>
      <text x="42" y="16" text-anchor="middle" class="pill-text">AppSec</text>

      <!-- Pill 2 -->
      <rect x="95" y="0" width="105" height="24" class="pill-bg"/>
      <text x="147" y="16" text-anchor="middle" class="pill-text">Threat Intel</text>

      <!-- Pill 3 -->
      <rect x="210" y="0" width="85" height="24" class="pill-bg"/>
      <text x="252" y="16" text-anchor="middle" class="pill-text">Pentesting</text>

      <!-- Pill 4 -->
      <rect x="305" y="0" width="105" height="24" class="pill-bg"/>
      <text x="357" y="16" text-anchor="middle" class="pill-text">OSINT Recon</text>

      <!-- Pill 5 -->
      <rect x="420" y="0" width="140" height="24" class="pill-bg"/>
      <text x="490" y="16" text-anchor="middle" class="pill-text">Systems Architecture</text>
    </g>
  </g>

  <!-- Right Decorative Cyber Accents -->
  <g transform="translate(810, 45)" opacity="0.6">
    <circle cx="20" cy="20" r="3" fill="#38bdf8"/>
    <circle cx="40" cy="20" r="3" fill="#1e293b"/>
    <circle cx="60" cy="20" r="3" fill="#1e293b"/>
    <circle cx="20" cy="40" r="3" fill="#1e293b"/>
    <circle cx="40" cy="40" r="3" fill="#818cf8"/>
    <circle cx="60" cy="40" r="3" fill="#1e293b"/>
    <circle cx="20" cy="60" r="3" fill="#1e293b"/>
    <circle cx="40" cy="60" r="3" fill="#1e293b"/>
    <circle cx="60" cy="60" r="3" fill="#c084fc"/>
  </g>
  
  <!-- Subtle Bottom Highlight Line -->
  <rect x="0" y="238" width="900" height="2" fill="url(#cyanGrad)"/>
</svg>
