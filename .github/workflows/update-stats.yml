name: Update GitHub Telemetry Assets

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-stats.yml'

permissions:
  contents: write

jobs:
  refresh-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and Validate Telemetry SVGs
        run: |
          python -c "
          import urllib.request, os

          endpoints = {
              'assets/github-stats.svg': 'https://github-readme-stats-anuraghazra1.vercel.app/api?username=Akhil-Binu&show_icons=true&theme=tokyonight&hide_border=true&count_private=true&title_color=38BDF8&text_color=94A3B8&icon_color=38BDF8',
              'assets/top-languages.svg': 'https://github-readme-stats-anuraghazra1.vercel.app/api/top-langs/?username=Akhil-Binu&layout=compact&theme=tokyonight&hide_border=true&title_color=38BDF8&text_color=94A3B8',
              'assets/github-streak.svg': 'https://streak-stats.demolab.com/?user=Akhil-Binu&theme=tokyonight&hide_border=true&ring=38BDF8&fire=38BDF8&currStreakLabel=38BDF8'
          }

          os.makedirs('assets', exist_ok=True)

          for path, url in endpoints.items():
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      data = resp.read()
                  if b'<svg' in data and b'</svg>' in data:
                      with open(path, 'wb') as f:
                          f.write(data)
                      print(f'Successfully updated {path} ({len(data)} bytes)')
                  else:
                      print(f'Warning: Non-SVG or error returned for {path}, keeping previous version.')
              except Exception as e:
                  print(f'Error fetching {url}: {e}, keeping previous version.')
          "

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if git diff --staged --quiet; then
            echo "No changes in telemetry SVGs."
          else
            git commit -m "chore(telemetry): auto-update profile telemetry stats [skip ci]"
            git push
          fi
